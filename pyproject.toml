[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "genpark-bio-agent"
version = "2.0.0"
description = "Flagship MCP Suite for Personal Longevity, Metabolism, Biomarkers, Hemodynamics & Chronobiology. Built for GenPark (https://www.genpark.ai)."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [
    { name = "GenPark AI", email = "engineering@genpark.ai" }
]
urls = { "Homepage" = "https://www.genpark.ai", "LinkedIn" = "https://www.linkedin.com/company/92955550", "Repository" = "https://github.com/alphaparkinc/genpark-bio-agent" }
keywords = ["mcp", "longevity", "biohacking", "metabolism", "circadian-rhythm", "agentic-ai", "genpark"]
classifiers = [
    "Development Status :: 5 - Production/Stable",
    "Intended Audience :: Developers",
    "Intended Audience :: Healthcare Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Medical Science Apps."
]
dependencies = []

[project.scripts]
genpark-bio = "genpark_bio.cli:main"

[tool.hatch.build.targets.wheel]
packages = ["src/genpark_bio"]
